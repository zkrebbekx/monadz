name: pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.27.x"
      - name: test the scenarios
        run: go test ./playground/...
      - name: build the WebAssembly
        run: GOOS=js GOARCH=wasm go build -trimpath -ldflags="-s -w" -o playground/web/monadz.wasm ./playground/wasm
      - name: copy wasm_exec.js
        run: cp "$(go env GOROOT)/lib/wasm/wasm_exec.js" playground/web/wasm_exec.js
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: playground/web

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
